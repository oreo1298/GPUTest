name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  QT_VERSION: "6.12.0"
  SLANG_VERSION: "2026.20"
  VULKAN_SDK_VERSION: "1.4.363.0"
  # Direct3D 12 test runtimes for the Windows smoke test (staged next to the test build only;
  # neither is packaged: WARP's license is test-only, the Agility SDK's needs an owner decision).
  AGILITY_SDK_VERSION: "1.619.6"
  WARP_VERSION: "1.0.21"
  DXC_VERSION: "1.9.2609.5"

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            preset: ci-linux-gcc
            package: true
          - compiler: clang
            preset: ci-linux-clang
            package: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache clang lld \
            mesa-vulkan-drivers libvulkan-dev vulkan-tools vulkan-validationlayers libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev wayland-protocols \
            libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xkb1 libfuse2t64 file patchelf desktop-file-utils fonts-dejavu-core

      - name: Vulkan validation layers (LunarG SDK)
        run: |
          # Newest validation layers; Ubuntu's 1.3.275 layer does not know Vulkan 1.4.
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/vksdk.tar.xz" "$url"; then
            mkdir -p "$RUNNER_TEMP/vksdk"
            tar -xJf "$RUNNER_TEMP/vksdk.tar.xz" -C "$RUNNER_TEMP/vksdk" --wildcards '*/x86_64/lib/libVkLayer_khronos_validation.so' '*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json'
            layer_json="$(find "$RUNNER_TEMP/vksdk" -name VkLayer_khronos_validation.json | head -1)"
            echo "VK_LAYER_PATH=$(dirname "$layer_json")" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$(dirname "$(find "$RUNNER_TEMP/vksdk" -name libVkLayer_khronos_validation.so | head -1)")" >> "$GITHUB_ENV"
          else
            echo "::warning::LunarG SDK download failed; using Ubuntu's validation layers"
          fi

      - name: Find Qt add-on modules
        run: |
          python3 -m pip install --quiet --user "aqtinstall>=3.3"
          mods="$(python3 -m aqt list-qt linux desktop --modules "$QT_VERSION" linux_gcc_64 | tr ' ' '\n' | grep -E '^qtwayland' | tr '\n' ' ' || true)"
          echo "Qt add-on modules: ${mods:-none}"
          echo "QT_LINUX_MODULES=${mods% }" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_LINUX_MODULES }}
          cache: true

      - name: Install Slang
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fsSL --retry 3 "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}
          max-size: 1G

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0 2>&1 | tee build/${{ matrix.preset }}/build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Runner smoke test (lavapipe)
        run: scripts/ci-smoke.sh build/${{ matrix.preset }}

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-${{ matrix.compiler }}
          path: build/${{ matrix.preset }}/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package AppImage
        if: matrix.package
        run: scripts/package-appimage.sh build/${{ matrix.preset }} dist 2>&1 | tee build/${{ matrix.preset }}/package.log; exit ${PIPESTATUS[0]}

      - name: Upload AppImage
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Annotate failures
        if: failure()
        run: scripts/ci-annotate.sh build/${{ matrix.preset }}

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git cmake ninja

      - uses: actions/checkout@v5

      - name: Check PKGBUILD versions
        run: |
          app="$(sed -nE 's/^set\(APP_VERSION "([^"]*)"\).*/\1/p' cmake/AppInfo.cmake)"
          pkg="$(sed -nE 's/^pkgver=(.*)$/\1/p' packaging/arch/PKGBUILD)"
          slang="$(sed -nE 's/^_slangver=(.*)$/\1/p' packaging/arch/PKGBUILD)"
          ok=1
          [ "$pkg" = "$app" ] || { echo "::error file=packaging/arch/PKGBUILD::pkgver $pkg differs from APP_VERSION $app"; ok=0; }
          [ "$slang" = "$SLANG_VERSION" ] || { echo "::error file=packaging/arch/PKGBUILD::_slangver $slang differs from SLANG_VERSION $SLANG_VERSION"; ok=0; }
          [ "$ok" = 1 ]

      - name: makepkg (as in the README)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg -s --noconfirm

      - name: Install and run the package
        run: |
          pacman -U --noconfirm packaging/arch/kiln-[0-9]*.pkg.tar.zst
          pacman -S --noconfirm --needed vulkan-swrast ttf-dejavu
          pacman -Ql kiln | grep -E '/usr/bin/|\.desktop$|\.svg$'
          kiln-run --version
          kiln-run --list-devices
          kiln-run --suite smoke --offscreen --resolution 320x180 --out "$RUNNER_TEMP/arch-smoke.json"
          kiln-hw-report --help
          QT_QPA_PLATFORM=offscreen kiln --screenshots "$RUNNER_TEMP/shots"
          ls "$RUNNER_TEMP/shots" | grep -c '\.png$'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/kiln-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  linux-sanitizers:
    name: Linux ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache clang lld \
            mesa-vulkan-drivers libvulkan-dev vulkan-tools vulkan-validationlayers libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev
      - name: Vulkan validation layers (LunarG SDK)
        run: |
          # Newest validation layers; Ubuntu's 1.3.275 layer does not know Vulkan 1.4.
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/vksdk.tar.xz" "$url"; then
            mkdir -p "$RUNNER_TEMP/vksdk"
            tar -xJf "$RUNNER_TEMP/vksdk.tar.xz" -C "$RUNNER_TEMP/vksdk" --wildcards '*/x86_64/lib/libVkLayer_khronos_validation.so' '*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json'
            layer_json="$(find "$RUNNER_TEMP/vksdk" -name VkLayer_khronos_validation.json | head -1)"
            echo "VK_LAYER_PATH=$(dirname "$layer_json")" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=$(dirname "$(find "$RUNNER_TEMP/vksdk" -name libVkLayer_khronos_validation.so | head -1)")" >> "$GITHUB_ENV"
          else
            echo "::warning::LunarG SDK download failed; using Ubuntu's validation layers"
          fi
      - name: Install Slang
        run: |
          mkdir -p "$RUNNER_TEMP/slang"
          curl -fsSL --retry 3 "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-asan
          max-size: 1G
      - name: Configure
        run: cmake --preset ci-linux-asan
      - name: Build
        run: cmake --build --preset ci-linux-asan -- -k 0 2>&1 | tee build/ci-linux-asan/build.log; exit ${PIPESTATUS[0]}
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ci-linux-asan
      - name: Runner smoke test (lavapipe, sanitized)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: scripts/ci-smoke.sh build/ci-linux-asan --quick

      - name: Annotate failures
        if: failure()
        run: scripts/ci-annotate.sh build/ci-linux-asan

  windows:
    name: Windows MSVC
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find Qt MSVC package
        shell: pwsh
        run: |
          # aqt cannot always read the Windows repository metadata of the newest Qt
          # release; fall back to the newest older release it can install.
          python -m pip install --quiet "aqtinstall>=3.3"
          $all = (python -m aqt list-qt windows desktop) -split '\s+' | Where-Object { $_ -match '^6\.\d+\.\d+$' }
          $latestPerMinor = $all | Group-Object { ($_ -split '\.')[0..1] -join '.' } |
              ForEach-Object { $_.Group | Sort-Object { [version]$_ } | Select-Object -Last 1 } |
              Sort-Object { [version]$_ } -Descending
          $candidates = @($env:QT_VERSION) + @($latestPerMinor | Where-Object { [version]$_ -lt [version]$env:QT_VERSION } | Select-Object -First 4)
          $ver = $null; $arch = $null
          foreach ($v in $candidates) {
            $archs = ((python -m aqt list-qt windows desktop --arch $v 2>$null) -split '\s+') | Where-Object { $_ -match '^win64_msvc\d+_64$' }
            if ($archs) { $ver = $v; $arch = ($archs | Sort-Object -Descending | Select-Object -First 1); break }
            Write-Host "Qt $v not installable with aqt here; trying an older release"
          }
          if (-not $ver) { Write-Host "::error::no installable Qt version found (tried $candidates)"; exit 1 }
          if ($ver -ne $env:QT_VERSION) { Write-Host "::warning::Qt $($env:QT_VERSION) unavailable for Windows via aqt; using $ver" }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_WIN_VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "QT_ARCH=$arch"
          Write-Host "::notice::Using Qt $ver ($arch)"
          exit 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_WIN_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Install Slang
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "slang"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "slang.zip"
          Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst
          # slangc compiles DXIL through the dxcompiler.dll next to it; use a DXC that knows
          # shader models 6.8/6.9 (work graphs, SER, OMM). Build-time only, never packaged.
          $dxc = Join-Path $env:RUNNER_TEMP "dxc"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.dxc/$env:DXC_VERSION/microsoft.direct3d.dxc.$env:DXC_VERSION.nupkg" -OutFile "$dxc.zip"
          Expand-Archive -Path "$dxc.zip" -DestinationPath $dxc
          Copy-Item "$dxc/build/native/bin/x64/dxcompiler.dll", "$dxc/build/native/bin/x64/dxil.dll" (Join-Path $dst "bin") -Force
          & "$dxc/build/native/bin/x64/dxc.exe" --version
          # The same DXC compiles the HLSL-only shaders (work graphs).
          Add-Content -Path $env:GITHUB_ENV -Value "DXC_DIR=$dxc/build/native/bin/x64"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dst "bin")

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        id: build
        shell: bash
        run: cmake --build --preset ci-windows -- -k 0 2>&1 | tee build/ci-windows/build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests
        run: ctest --preset ci-windows

      - name: Stage Direct3D 12 test runtimes (Agility SDK, WARP)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "d3d12-nuget"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          foreach ($p in @(@("microsoft.direct3d.d3d12", $env:AGILITY_SDK_VERSION), @("microsoft.direct3d.warp", $env:WARP_VERSION))) {
            $zip = Join-Path $tmp "$($p[0]).zip"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$($p[0])/$($p[1])/$($p[0]).$($p[1]).nupkg" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath (Join-Path $tmp $p[0]) -Force
          }
          $bin = "build/ci-windows/bin"
          New-Item -ItemType Directory -Force -Path "$bin/D3D12" | Out-Null
          $agility = "$tmp/microsoft.direct3d.d3d12/build/native/bin/x64"
          Copy-Item "$agility/D3D12Core.dll", "$agility/d3d12SDKLayers.dll" "$bin/D3D12/"
          Copy-Item "$tmp/microsoft.direct3d.warp/build/native/bin/x64/d3d10warp.dll" "$bin/"
          Get-ChildItem -Recurse $bin -Filter *.dll | ForEach-Object { Write-Host $_.FullName }

      - name: Runner smoke test (WARP)
        shell: pwsh
        run: pwsh scripts/ci-smoke.ps1 -BuildDir build/ci-windows

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: build/ci-windows/smoke/
          if-no-files-found: ignore
          retention-days: 14

      # Every push that builds gets its portable zip, also when a smoke check failed.
      - name: Package portable zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: pwsh scripts/package-windows.ps1 -BuildDir build/ci-windows -OutDir dist

      - name: Upload portable zip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*-portable.zip
          if-no-files-found: error

      - name: Annotate failures
        if: failure()
        shell: bash
        run: scripts/ci-annotate.sh build/ci-windows
